name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "canon-demo/frontend -> target"
      - name: Install Trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin trunk
          sudo chmod +x /usr/local/bin/trunk
      - name: Build frontend (release)
        working-directory: canon-demo/frontend
        run: trunk build --release

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked
      - name: Run tier 1 tests (in-memory, fast)
        run: |
          cargo nextest run --workspace --profile ci \
            -E 'not test(tier2)' \
            --exclude canon-command-store-yugabyte \
            --exclude canon-deadletter-yugabyte \
            --exclude canon-event-store-cassandra \
            --exclude canon-inbox-yugabyte \
            --exclude canon-inbound-queue-kafka \
            --exclude canon-outbound-queue-kafka \
            --exclude canon-projection-store-yugabyte \
            --exclude canon-publisher-kafka \
            --exclude canon-snapshot-store-yugabyte \
            --exclude canon-adaptor-kafka
      - name: Run tier 2 tests (testcontainers)
        run: cargo test -p canon-test -- tier2 --test-threads=1

  coverage:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Run coverage
        run: |
          cargo tarpaulin --workspace --timeout 300 \
            --ignore-tests \
            --exclude-files 'canon-demo/*' \
            --exclude-files 'canon-adaptor-kafka/*' \
            --exclude-files 'canon-command-store-yugabyte/*' \
            --exclude-files 'canon-event-store-cassandra/*' \
            --exclude-files 'canon-inbound-queue-kafka/*' \
            --exclude-files 'canon-inbox-yugabyte/*' \
            --exclude-files 'canon-outbound-queue-kafka/*' \
            --exclude-files 'canon-projection-store-yugabyte/*' \
            --exclude-files 'canon-publisher-kafka/*' \
            --exclude-files 'canon-snapshot-store-yugabyte/*' \
            --exclude-files 'canon-deadletter-yugabyte/*' \
            --exclude-files 'canon-test/*' \
            --exclude canon-demo-shared fleet-service cargo-service navigation-service station-service supply-service gateway frontend \
            --exclude canon-core-macros \
            --exclude canon-test \
            --exclude canon-adaptor canon-adaptor-kafka \
            --exclude canon-command-store canon-command-store-yugabyte \
            --exclude canon-event-store canon-event-store-cassandra \
            --exclude canon-inbound-queue canon-inbound-queue-kafka \
            --exclude canon-inbox canon-inbox-yugabyte \
            --exclude canon-outbound-queue canon-outbound-queue-kafka \
            --exclude canon-projection-store canon-projection-store-yugabyte \
            --exclude canon-publisher canon-publisher-kafka \
            --exclude canon-snapshot-store canon-snapshot-store-yugabyte \
            --exclude canon-deadletter canon-deadletter-yugabyte \
            --fail-under 70
