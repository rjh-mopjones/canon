[package]
name = "canon-core"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "1"
inventory = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }
