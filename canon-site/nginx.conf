server {
    listen 80;
    server_tokens off;

    # --- Default proxy headers ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Demo app — proxy to frontend container ---
    # Security headers come from the frontend nginx.
    location /demo/ {
        proxy_pass http://frontend:80;
    }
    location = /demo {
        return 301 /demo/;
    }

    # --- API routes — proxy to gateway ---
    location /admin/ {
        proxy_pass http://gateway:8080;
    }
    location /debug/ {
        proxy_pass http://gateway:8080;
    }
    location /fleet/ {
        proxy_pass http://gateway:8080;
    }
    location /ships {
        proxy_pass http://gateway:8080;
    }
    location /cargo/ {
        proxy_pass http://gateway:8080;
    }
    location /stations {
        proxy_pass http://gateway:8080;
    }
    location /navigation/ {
        proxy_pass http://gateway:8080;
    }
    location /supply/ {
        proxy_pass http://gateway:8080;
    }
    location /sessions {
        proxy_pass http://gateway:8080;
    }
    location /health {
        proxy_pass http://gateway:8080;
    }
    location /replay/ {
        proxy_pass http://gateway:8080;
    }
    location /game/ {
        proxy_pass http://gateway:8080;
    }

    # --- WebSocket — proxy with upgrade headers ---
    location /events {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # --- Docs placeholder (redirect to GitHub until mdBook docs are deployed) ---
    location /docs {
        return 302 https://github.com/rjh-mopjones/canon#readme;
    }

    # --- Landing page static files ---
    # Security headers only on static content — proxied routes inherit from upstream.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:;" always;
    }

    # --- Gzip ---
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 256;
}
