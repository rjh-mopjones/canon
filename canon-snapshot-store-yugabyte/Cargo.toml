[package]
name = "canon-snapshot-store-yugabyte"
version = "0.1.0"
edition = "2021"

[dependencies]
canon-core = { path = "../canon-core" }
canon-snapshot-store = { path = "../canon-snapshot-store" }
async-trait = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
testcontainers = "0.27.1"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
