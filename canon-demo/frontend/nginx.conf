server {
    listen 80;
    server_tokens off;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' wss: ws:; img-src 'self' data:;" always;

    # --- Block dotfiles, source maps, and sensitive paths ---
    location ~ /\. { return 404; }
    location ~* \.map$ { return 404; }

    # --- Admin/debug routes — proxy to gateway (auth handled by gateway middleware) ---
    location /admin/ {
        proxy_pass http://gateway:8080;
    }
    location /debug/ {
        proxy_pass http://gateway:8080;
    }

    # API routes — proxy to gateway
    location /fleet/ {
        proxy_pass http://gateway:8080;
    }
    location /ships {
        proxy_pass http://gateway:8080;
    }
    location /cargo/ {
        proxy_pass http://gateway:8080;
    }
    location /stations {
        proxy_pass http://gateway:8080;
    }
    location /navigation/ {
        proxy_pass http://gateway:8080;
    }
    location /supply/ {
        proxy_pass http://gateway:8080;
    }
    location /sessions {
        proxy_pass http://gateway:8080;
    }
    location /health {
        proxy_pass http://gateway:8080;
    }
    location /replay/ {
        proxy_pass http://gateway:8080;
    }

    # WebSocket — proxy with upgrade headers
    location /events {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Frontend static files — fallback
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
