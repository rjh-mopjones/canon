server {
    listen 80;

    # Re-resolve Docker DNS periodically so nginx picks up gateway IP changes
    resolver 127.0.0.11 valid=10s;

    # WebSocket proxy for live event streaming
    location /events {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # API reverse proxy — all gateway routes
    location ~ ^/(fleet|cargo|navigation|supply|stations|ships|admin|debug|replay)(/|$) {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files — frontend WASM bundle
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
