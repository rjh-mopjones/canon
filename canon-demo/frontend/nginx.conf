server {
    listen 80;
    server_tokens off;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' wss: ws:; img-src 'self' data:;" always;

    # --- Block dotfiles, source maps, and sensitive paths ---
    location ~ /\. { return 404; }
    location ~* \.map$ { return 404; }

    # --- Demo app served at /demo/ ---
    location /demo/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /demo/index.html;
    }

    # --- Health check for K8s probes ---
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Redirect bare /demo to /demo/
    location = /demo {
        return 301 https://$host/demo/;
    }
}
