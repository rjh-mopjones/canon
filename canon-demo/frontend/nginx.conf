server {
    listen 80;

    # API routes — proxy to gateway
    location /fleet/ {
        proxy_pass http://gateway:8080;
    }
    location /ships {
        proxy_pass http://gateway:8080;
    }
    location /cargo/ {
        proxy_pass http://gateway:8080;
    }
    location /stations {
        proxy_pass http://gateway:8080;
    }
    location /navigation/ {
        proxy_pass http://gateway:8080;
    }
    location /supply/ {
        proxy_pass http://gateway:8080;
    }
    location /admin/ {
        proxy_pass http://gateway:8080;
    }
    location /sessions {
        proxy_pass http://gateway:8080;
    }
    location /health {
        proxy_pass http://gateway:8080;
    }
    location /debug/ {
        proxy_pass http://gateway:8080;
    }
    location /replay/ {
        proxy_pass http://gateway:8080;
    }

    # WebSocket — proxy with upgrade headers
    location /events {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Frontend static files — fallback
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
