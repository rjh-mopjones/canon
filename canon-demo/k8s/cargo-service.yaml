apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-service
  labels:
    app.kubernetes.io/name: cargo-service
    app.kubernetes.io/part-of: canon-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-service
  template:
    metadata:
      labels:
        app: cargo-service
    spec:
      containers:
        - name: cargo-service
          image: canon-demo/cargo-service
          env:
            - name: YUGABYTE_URL
              valueFrom:
                configMapKeyRef:
                  name: canon-demo-config
                  key: yugabyte_url
            - name: CASSANDRA_NODES
              valueFrom:
                configMapKeyRef:
                  name: canon-demo-config
                  key: cassandra_nodes
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: canon-demo-config
                  key: kafka_brokers
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cargo-service
spec:
  selector:
    app: cargo-service
  ports:
    - port: 8080
      targetPort: 8080
