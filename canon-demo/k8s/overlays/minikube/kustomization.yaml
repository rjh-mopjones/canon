apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Set imagePullPolicy: Never for all locally-built images.
  # Infrastructure images (yugabytedb, cassandra, kafka, zookeeper) use
  # public registry images so they keep the default pull policy.

  # Fleet service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fleet-service
      spec:
        template:
          spec:
            containers:
              - name: fleet-service
                imagePullPolicy: Never
  # Cargo service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cargo-service
      spec:
        template:
          spec:
            containers:
              - name: cargo-service
                imagePullPolicy: Never
  # Navigation service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: navigation-service
      spec:
        template:
          spec:
            containers:
              - name: navigation-service
                imagePullPolicy: Never
  # Supply service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: supply-service
      spec:
        template:
          spec:
            containers:
              - name: supply-service
                imagePullPolicy: Never
  # Station service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: station-service
      spec:
        template:
          spec:
            containers:
              - name: station-service
                imagePullPolicy: Never
  # Gateway
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway
      spec:
        template:
          spec:
            containers:
              - name: gateway
                imagePullPolicy: Never
  # Frontend
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
              - name: frontend
                imagePullPolicy: Never
  # Init schema job — override GKE defaults back to minikube-local endpoints,
  # disable Strimzi (minikube uses init-kafka-topics Job with kafka-topics.sh)
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: init-schema
      spec:
        template:
          spec:
            initContainers:
              - name: wait-yugabytedb
                env:
                  - name: YUGABYTE_HOST
                    value: "yugabytedb"
                  - name: YUGABYTE_PORT
                    value: "5433"
              - name: wait-cassandra
                env:
                  - name: CASSANDRA_HOST
                    value: "cassandra"
                  - name: CASSANDRA_PORT
                    value: "9042"
            containers:
              - name: init-schema
                imagePullPolicy: Never
                env:
                  - name: YUGABYTE_HOST
                    value: "yugabytedb"
                  - name: YUGABYTE_PORT
                    value: "5433"
                  - name: YSQL_USER
                    value: "canon"
                  - name: YSQL_PASSWORD
                    value: "canon"
                  - name: YSQL_DB
                    value: "canon"
                  - name: CASSANDRA_HOST
                    value: "cassandra"
                  - name: CASSANDRA_PORT
                    value: "9042"
                  - name: KAFKA_TOPICS_VIA_STRIMZI
                    value: "false"
