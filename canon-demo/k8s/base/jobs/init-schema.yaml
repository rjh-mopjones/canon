apiVersion: v1
kind: ServiceAccount
metadata:
  name: init-schema-sa
  labels:
    app.kubernetes.io/part-of: canon-demo
    tier: init
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: init-schema-kafka-topics
  labels:
    app.kubernetes.io/part-of: canon-demo
    tier: init
rules:
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkatopics"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: init-schema-kafka-topics
  labels:
    app.kubernetes.io/part-of: canon-demo
    tier: init
subjects:
  - kind: ServiceAccount
    name: init-schema-sa
    namespace: canon
roleRef:
  kind: ClusterRole
  name: init-schema-kafka-topics
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-schema
  labels:
    app.kubernetes.io/part-of: canon-demo
    tier: init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: init-schema
        tier: init
    spec:
      serviceAccountName: init-schema-sa
      restartPolicy: OnFailure
      initContainers:
        - name: wait-yugabytedb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for YugabyteDB..."
              YBHOST="${YUGABYTE_HOST:-yb-tservers.canon-infra.svc.cluster.local}"
              YBPORT="${YUGABYTE_PORT:-5433}"
              until nc -z "$YBHOST" "$YBPORT"; do
                echo "  $YBHOST:$YBPORT not ready, retrying in 2s..."
                sleep 2
              done
              echo "YugabyteDB is ready."
          env:
            - name: YUGABYTE_HOST
              value: "yb-tservers.canon-infra.svc.cluster.local"
            - name: YUGABYTE_PORT
              value: "5433"
        - name: wait-cassandra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Cassandra..."
              CHOST="${CASSANDRA_HOST:-cassandra.canon-infra.svc.cluster.local}"
              CPORT="${CASSANDRA_PORT:-9042}"
              until nc -z "$CHOST" "$CPORT"; do
                echo "  $CHOST:$CPORT not ready, retrying in 2s..."
                sleep 2
              done
              echo "Cassandra is ready."
          env:
            - name: CASSANDRA_HOST
              value: "cassandra.canon-infra.svc.cluster.local"
            - name: CASSANDRA_PORT
              value: "9042"
      containers:
        - name: init-schema
          image: canon-demo/init-schema
          env:
            - name: YUGABYTE_HOST
              value: "yb-tservers.canon-infra.svc.cluster.local"
            - name: YUGABYTE_PORT
              value: "5433"
            - name: YSQL_USER
              value: "yugabyte"
            - name: YSQL_PASSWORD
              value: "yugabyte"
            - name: YSQL_DB
              value: "yugabyte"
            - name: CASSANDRA_HOST
              value: "cassandra.canon-infra.svc.cluster.local"
            - name: CASSANDRA_PORT
              value: "9042"
            - name: KAFKA_TOPICS_VIA_STRIMZI
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
