apiVersion: batch/v1
kind: Job
metadata:
  name: init-schema
  labels:
    app.kubernetes.io/part-of: canon-demo
    tier: init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: init-schema
        tier: init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-yugabytedb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for YugabyteDB..."
              until nc -z yugabytedb 5433; do
                echo "  yugabytedb:5433 not ready, retrying in 2s..."
                sleep 2
              done
              echo "YugabyteDB is ready."
        - name: wait-cassandra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Cassandra..."
              until nc -z cassandra 9042; do
                echo "  cassandra:9042 not ready, retrying in 2s..."
                sleep 2
              done
              echo "Cassandra is ready."
      containers:
        - name: init-schema
          image: canon-demo/init-schema
          env:
            - name: YUGABYTE_HOST
              value: "yugabytedb"
            - name: YUGABYTE_PORT
              value: "5433"
            - name: YSQL_USER
              value: "canon"
            - name: YSQL_PASSWORD
              value: "canon"
            - name: YSQL_DB
              value: "canon"
            - name: CASSANDRA_HOST
              value: "cassandra"
            - name: CASSANDRA_PORT
              value: "9042"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
