apiVersion: batch/v1
kind: Job
metadata:
  name: init-kafka-topics
  labels:
    app.kubernetes.io/part-of: canon-demo
    tier: init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: init-kafka-topics
        tier: init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka..."
              until nc -z kafka 9092; do
                echo "  kafka:9092 not ready, retrying in 2s..."
                sleep 2
              done
              echo "Kafka is ready."
      containers:
        - name: init-kafka-topics
          image: confluentinc/cp-kafka:7.7.1
          command:
            - /bin/sh
            - -c
            - |
              echo '==> Creating Kafka topics (15 total: 5 inbound + 5 outbound + 5 events)...'
              for topic in \
                canon.fleet.inbound \
                canon.cargo.inbound \
                canon.navigation.inbound \
                canon.supply.inbound \
                canon.station.inbound \
                canon.fleet.outbound \
                canon.cargo.outbound \
                canon.navigation.outbound \
                canon.supply.outbound \
                canon.station.outbound \
                canon.fleet.events \
                canon.cargo.events \
                canon.navigation.events \
                canon.supply.events \
                canon.station.events; do
                kafka-topics --bootstrap-server kafka:9092 \
                  --create --if-not-exists \
                  --topic $topic \
                  --partitions 3 \
                  --replication-factor 1
                echo "    created topic: $topic"
              done
              echo '==> All 15 Kafka topics ready.'
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
