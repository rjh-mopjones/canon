apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-service
  labels:
    app: fleet-service
    app.kubernetes.io/name: fleet-service
    app.kubernetes.io/part-of: canon-demo
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-service
  template:
    metadata:
      labels:
        app: fleet-service
        tier: app
    spec:
      initContainers:
        - name: wait-infra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for YugabyteDB..."
              until nc -z yugabytedb 5433; do sleep 2; done
              echo "Waiting for Cassandra..."
              until nc -z cassandra 9042; do sleep 2; done
              echo "Waiting for Kafka..."
              until nc -z kafka 9092; do sleep 2; done
              echo "All infrastructure ready."
      containers:
        - name: fleet-service
          image: canon-demo/fleet-service
          env:
            - name: YUGABYTE_URL
              valueFrom:
                configMapKeyRef:
                  name: canon-config
                  key: yugabyte_url
            - name: CASSANDRA_NODES
              valueFrom:
                configMapKeyRef:
                  name: canon-config
                  key: cassandra_nodes
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: canon-config
                  key: kafka_brokers
            - name: RUST_LOG
              value: info
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
