apiVersion: apps/v1
kind: Deployment
metadata:
  name: station-service
  labels:
    app: station-service
    app.kubernetes.io/name: station-service
    app.kubernetes.io/part-of: canon-demo
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: station-service
  template:
    metadata:
      labels:
        app: station-service
        tier: app
    spec:
      containers:
        - name: station-service
          image: canon-demo/station-service
          env:
            - name: YUGABYTE_URL
              valueFrom:
                configMapKeyRef:
                  name: canon-config
                  key: yugabyte_url
            - name: CASSANDRA_NODES
              valueFrom:
                configMapKeyRef:
                  name: canon-config
                  key: cassandra_nodes
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: canon-config
                  key: kafka_brokers
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
