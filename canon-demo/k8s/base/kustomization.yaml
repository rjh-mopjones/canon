apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: canon

resources:
  # Namespace
  - namespace.yaml

  # Config
  - config.yaml

  # Infrastructure StatefulSets
  - infra/yugabytedb.yaml
  - infra/cassandra.yaml
  - infra/zookeeper.yaml
  - infra/kafka.yaml

  # Init Jobs
  - jobs/init-schema.yaml
  - jobs/init-kafka-topics.yaml

  # Canon services (background processors — no exposed ports)
  - services/fleet-service.yaml
  - services/cargo-service.yaml
  - services/navigation-service.yaml
  - services/supply-service.yaml
  - services/station-service.yaml

  # Gateway + Frontend + Landing site (exposed ports)
  - gateway.yaml
  - frontend.yaml
  - canon-site.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: canon-demo
    includeSelectors: false
