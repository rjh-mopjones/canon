apiVersion: v1
kind: ConfigMap
metadata:
  name: canon-config
  labels:
    app.kubernetes.io/part-of: canon-demo
data:
  yugabyte_url: "postgres://canon:canon@yugabytedb:5433/canon"
  cassandra_nodes: "cassandra:9042"
  kafka_brokers: "kafka:9092"
  gateway_url: "http://gateway:8080"
  # Schema and topic prefix.
  SCHEMA_PREFIX: "canon"
  TOPIC_PREFIX: "canon"
  # Per-service schema/keyspace names for storage isolation.
  # Each service uses its own YugabyteDB schema and Cassandra keyspace.
  fleet_schema: "canon_fleet"
  cargo_schema: "canon_cargo"
  navigation_schema: "canon_navigation"
  supply_schema: "canon_supply"
  station_schema: "canon_station"
