apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: canon-demo
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: app
    spec:
      containers:
        - name: gateway
          image: canon-demo/gateway
          ports:
            - containerPort: 8080
          env:
            - name: YUGABYTE_URL
              valueFrom:
                configMapKeyRef:
                  name: canon-config
                  key: yugabyte_url
            - name: CASSANDRA_NODES
              valueFrom:
                configMapKeyRef:
                  name: canon-config
                  key: cassandra_nodes
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: canon-config
                  key: kafka_brokers
            - name: CORS_ORIGIN
              value: "http://frontend"
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: info
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: canon-demo
    tier: app
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
