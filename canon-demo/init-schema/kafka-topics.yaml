# Canon Kafka topics — Strimzi KafkaTopic CRDs
# Creates 15 topics for prod.
# Each service has 3 topics: inbound, outbound, events.
# Applied by init.sh via kubectl when KAFKA_TOPICS_VIA_STRIMZI=true.
#
# Strimzi cluster name: kafka (matches metadata.labels strimzi.io/cluster)
# Namespace: canon-infra (where Strimzi operator + Kafka cluster live)

# ════════════════════════════════════════════════════════════════════════════
# Topics (15)
# ════════════════════════════════════════════════════════════════════════════

# ── Fleet ────────────────────────────────────────────────────────────────────
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: canon.fleet.inbound
  namespace: canon-infra
  labels:
    strimzi.io/cluster: kafka
    canon.env: prod
spec:
  partitions: 1
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: canon.fleet.outbound
  namespace: canon-infra
  labels:
    strimzi.io/cluster: kafka
    canon.env: prod
spec:
  partitions: 1
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: canon.fleet.events
  namespace: canon-infra
  labels:
    strimzi.io/cluster: kafka
    canon.env: prod
spec:
  partitions: 1
  replicas: 1

