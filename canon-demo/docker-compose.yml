services:
  yugabytedb:
    image: yugabytedb/yugabyte:2.23.1.0-b220
    command: >
      bin/yugabyted start
      --daemon=false
      --tserver_flags="ysql_enable_auth=false"
    ports:
      - "5433:5433"
      - "9000:9000"
    environment:
      YSQL_USER: canon
      YSQL_PASSWORD: canon
      YSQL_DB: canon
    healthcheck:
      test: ["CMD", "bin/ysqlsh", "-U", "yugabyte", "-c", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: canon
      CASSANDRA_DC: dc1
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 10s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

  fleet-service:
    build:
      context: ..
      dockerfile: canon-demo/fleet-service/Dockerfile
    depends_on:
      yugabytedb:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      YUGABYTE_URL: "yugabyte://canon:canon@yugabytedb:5433/canon"
      CASSANDRA_NODES: "cassandra:9042"
      KAFKA_BROKERS: "kafka:9092"
      RUST_LOG: info
