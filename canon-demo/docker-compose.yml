services:
  yugabytedb:
    image: yugabytedb/yugabyte:2.23.1.0-b220
    command: >
      bin/yugabyted start
      --daemon=false
      --tserver_flags="ysql_enable_auth=false"
    ports:
      - "5433:5433"
      - "9000:9000"
    environment:
      YSQL_USER: canon
      YSQL_PASSWORD: canon
      YSQL_DB: canon
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=canon bin/ysqlsh -h $(hostname -i) -U canon -d canon -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: canon
      CASSANDRA_DC: dc1
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 10s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dual-listener Kafka setup:
  #   INTERNAL (port 9092) — used by Docker-internal services via kafka:9092
  #   EXTERNAL (port 9093) — used by host-mode services via localhost:9093
  # This avoids the problem where Kafka advertises kafka:9092 in metadata,
  # which is unresolvable from the host.
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Schema initialisation ──────────────────────────────────────────────
  init-schema:
    build:
      context: init-schema
      dockerfile: Dockerfile
    depends_on:
      yugabytedb:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    environment:
      YUGABYTE_HOST: yugabytedb
      YUGABYTE_PORT: "5433"
      YSQL_USER: canon
      YSQL_PASSWORD: canon
      YSQL_DB: canon
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"

  init-kafka-topics:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo '==> Creating Kafka topics (15 total: 5 inbound + 5 outbound + 5 events)...'
      for topic in canon.fleet.inbound canon.cargo.inbound canon.navigation.inbound canon.supply.inbound canon.station.inbound canon.fleet.outbound canon.cargo.outbound canon.navigation.outbound canon.supply.outbound canon.station.outbound canon.fleet.events canon.cargo.events canon.navigation.events canon.supply.events canon.station.events; do
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
        echo \"    created topic: $$topic\"
      done
      echo '==> All 15 Kafka topics ready.'
      "
    restart: "no"

  # ── Demo services ──────────────────────────────────────────────────────
  fleet-service:
    image: canon-demo-fleet-service:latest
    build:
      context: ..
      dockerfile: canon-demo/fleet-service/Dockerfile
    depends_on:
      init-schema:
        condition: service_completed_successfully
      init-kafka-topics:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      YUGABYTE_URL: "postgres://canon:canon@yugabytedb:5433/canon"
      CASSANDRA_NODES: "cassandra:9042"
      KAFKA_BROKERS: "kafka:9092"
      RUST_LOG: info

  cargo-service:
    image: canon-demo-cargo-service:latest
    build:
      context: ..
      dockerfile: canon-demo/cargo-service/Dockerfile
    depends_on:
      init-schema:
        condition: service_completed_successfully
      init-kafka-topics:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      YUGABYTE_URL: "postgres://canon:canon@yugabytedb:5433/canon"
      CASSANDRA_NODES: "cassandra:9042"
      KAFKA_BROKERS: "kafka:9092"
      RUST_LOG: info

  navigation-service:
    image: canon-demo-navigation-service:latest
    build:
      context: ..
      dockerfile: canon-demo/navigation-service/Dockerfile
    depends_on:
      init-schema:
        condition: service_completed_successfully
      init-kafka-topics:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      YUGABYTE_URL: "postgres://canon:canon@yugabytedb:5433/canon"
      CASSANDRA_NODES: "cassandra:9042"
      KAFKA_BROKERS: "kafka:9092"
      RUST_LOG: info

  station-service:
    image: canon-demo-station-service:latest
    build:
      context: ..
      dockerfile: canon-demo/station-service/Dockerfile
    depends_on:
      init-schema:
        condition: service_completed_successfully
      init-kafka-topics:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      YUGABYTE_URL: "postgres://canon:canon@yugabytedb:5433/canon"
      CASSANDRA_NODES: "cassandra:9042"
      KAFKA_BROKERS: "kafka:9092"
      RUST_LOG: info

  supply-service:
    image: canon-demo-supply-service:latest
    build:
      context: ..
      dockerfile: canon-demo/supply-service/Dockerfile
    depends_on:
      init-schema:
        condition: service_completed_successfully
      init-kafka-topics:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      YUGABYTE_URL: "postgres://canon:canon@yugabytedb:5433/canon"
      CASSANDRA_NODES: "cassandra:9042"
      KAFKA_BROKERS: "kafka:9092"
      RUST_LOG: info

  gateway:
    image: canon-demo-gateway:latest
    build:
      context: ..
      dockerfile: canon-demo/gateway/Dockerfile
    depends_on:
      init-schema:
        condition: service_completed_successfully
      init-kafka-topics:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      YUGABYTE_URL: "postgres://canon:canon@yugabytedb:5433/canon"
      CASSANDRA_NODES: "cassandra:9042"
      KAFKA_BROKERS: "kafka:9092"
      CORS_ORIGIN: "http://localhost:3000"
      LISTEN_ADDR: "0.0.0.0:8080"
      RUST_LOG: info

  frontend:
    build:
      context: ..
      dockerfile: canon-demo/frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - gateway
