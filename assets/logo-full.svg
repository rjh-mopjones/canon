<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
  <defs>
    <radialGradient id="face" cx="48%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#A8A8A0"/>
      <stop offset="70%" stop-color="#8E8E86"/>
      <stop offset="100%" stop-color="#787872"/>
    </radialGradient>
    <radialGradient id="bore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <radialGradient id="highlight" cx="38%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Icon centred at top -->
  <g transform="translate(180, 110)">
    <!-- Outer copper ring -->
    <circle cx="0" cy="0" r="96" fill="none" stroke="#D8896A" stroke-width="3"/>

    <!-- Dark outer rim -->
    <circle cx="0" cy="0" r="92" fill="#3A3A38"/>

    <!-- Main grey face -->
    <circle cx="0" cy="0" r="82" fill="url(#face)"/>

    <!-- Highlight crescent for depth -->
    <circle cx="0" cy="0" r="82" fill="url(#highlight)"/>

    <!-- Inner chamfer ring — darker grey transition into bore -->
    <circle cx="0" cy="0" r="58" fill="#636360"/>

    <!-- Inner copper ring accent -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#D8896A" stroke-width="2"/>

    <!-- Bore interior — dark grey -->
    <circle cx="0" cy="0" r="50" fill="#4A4A47"/>

    <!-- Rifling lines inside bore area -->
    <g opacity="0.15" stroke="#6E6E6A" stroke-width="1">
      <line x1="0" y1="-45" x2="0" y2="45"/>
      <line x1="-32" y1="-32" x2="32" y2="32"/>
      <line x1="-45" y1="0" x2="45" y2="0"/>
      <line x1="-32" y1="32" x2="32" y2="-32"/>
      <line x1="-18" y1="-44" x2="18" y2="44"/>
      <line x1="-44" y1="-18" x2="44" y2="18"/>
      <line x1="18" y1="-44" x2="-18" y2="44"/>
      <line x1="44" y1="-18" x2="-44" y2="18"/>
    </g>

    <!-- Centre dark bore hole — wide -->
    <circle cx="0" cy="0" r="40" fill="url(#bore)"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="240" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="32" font-weight="500" letter-spacing="0.15em"
        fill="#D8896A">CANON</text>

  <!-- Tagline -->
  <text x="180" y="268" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="0.05em"
        fill="#8C8A82">event sourcing for Rust</text>
</svg>
