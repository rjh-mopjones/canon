<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="face" cx="48%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#A8A8A0"/>
      <stop offset="70%" stop-color="#8E8E86"/>
      <stop offset="100%" stop-color="#787872"/>
    </radialGradient>
    <radialGradient id="bore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <radialGradient id="highlight" cx="38%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer copper ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#D8896A" stroke-width="3"/>

  <!-- Dark outer rim -->
  <circle cx="100" cy="100" r="92" fill="#3A3A38"/>

  <!-- Main grey face -->
  <circle cx="100" cy="100" r="82" fill="url(#face)"/>

  <!-- Highlight crescent for depth -->
  <circle cx="100" cy="100" r="82" fill="url(#highlight)"/>

  <!-- Inner chamfer ring — darker grey transition into bore -->
  <circle cx="100" cy="100" r="58" fill="#636360"/>

  <!-- Inner copper ring accent -->
  <circle cx="100" cy="100" r="52" fill="none" stroke="#D8896A" stroke-width="2"/>

  <!-- Bore interior — dark grey -->
  <circle cx="100" cy="100" r="50" fill="#4A4A47"/>

  <!-- Rifling lines inside bore area -->
  <g opacity="0.15" stroke="#6E6E6A" stroke-width="1">
    <line x1="100" y1="55" x2="100" y2="145"/>
    <line x1="68" y1="68" x2="132" y2="132"/>
    <line x1="55" y1="100" x2="145" y2="100"/>
    <line x1="68" y1="132" x2="132" y2="68"/>
    <line x1="82" y1="56" x2="118" y2="144"/>
    <line x1="56" y1="82" x2="144" y2="118"/>
    <line x1="118" y1="56" x2="82" y2="144"/>
    <line x1="144" y1="82" x2="56" y2="118"/>
  </g>

  <!-- Centre dark bore hole — wide -->
  <circle cx="100" cy="100" r="40" fill="url(#bore)"/>
</svg>
