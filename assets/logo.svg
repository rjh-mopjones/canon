<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="face" cx="45%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#B34A20"/>
      <stop offset="60%" stop-color="#993C1D"/>
      <stop offset="100%" stop-color="#712B13"/>
    </radialGradient>
    <radialGradient id="bore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a100a"/>
      <stop offset="100%" stop-color="#0e0a08"/>
    </radialGradient>
    <radialGradient id="highlight" cx="35%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer thin copper ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#D85A30" stroke-width="2"/>

  <!-- Dark outer circle — barrel rim depth -->
  <circle cx="100" cy="100" r="93" fill="#2C2C2A"/>

  <!-- Main bronze face -->
  <circle cx="100" cy="100" r="82" fill="url(#face)"/>

  <!-- Highlight crescent for depth -->
  <circle cx="100" cy="100" r="82" fill="url(#highlight)"/>

  <!-- Inner bore chamfer ring -->
  <circle cx="100" cy="100" r="38" fill="#4A1B0C"/>

  <!-- Thin copper inner ring accent -->
  <circle cx="100" cy="100" r="34" fill="none" stroke="#D85A30" stroke-width="1.5"/>

  <!-- Rifling lines inside bore area -->
  <g opacity="0.12" stroke="#D85A30" stroke-width="0.8">
    <line x1="100" y1="68" x2="100" y2="132"/>
    <line x1="78" y1="78" x2="122" y2="122"/>
    <line x1="68" y1="100" x2="132" y2="100"/>
    <line x1="78" y1="122" x2="122" y2="78"/>
    <line x1="86" y1="70" x2="114" y2="130"/>
    <line x1="70" y1="86" x2="130" y2="114"/>
    <line x1="114" y1="70" x2="86" y2="130"/>
    <line x1="130" y1="86" x2="70" y2="114"/>
  </g>

  <!-- Centre dark bore circle -->
  <circle cx="100" cy="100" r="22" fill="url(#bore)"/>
</svg>
