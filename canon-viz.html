<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canon — Codebase Visualiser</title>
<script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --raised: #21262d;
    --border: #30363d;
    --borderhi: #58a6ff;
    --cyan: #38bdf8;
    --green: #3fb950;
    --amber: #d29922;
    --red: #f85149;
    --purple: #a78bfa;
    --blue: #60a5fa;
    --orange: #fb923c;
    --yellow: #eab308;
    --txt: #c9d1d9;
    --txth: #e6edf3;
    --txtlo: #8b949e;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
    --sans: 'Inter', system-ui, sans-serif;

    --c-command: #f59e0b;
    --c-event: #a78bfa;
    --c-handler: #60a5fa;
    --c-aggregate: #10b981;
    --c-trait: #38bdf8;
    --c-infra: #ef4444;
    --c-kafka: #eab308;
    --c-db: #c084fc;
    --c-projection: #fb923c;
    --c-evt-handler: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--txt);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    height: 52px;
    flex-shrink: 0;
  }

  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--cyan);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .logo span { color: var(--txtlo); font-weight: 400; }

  .tabs {
    display: flex;
    gap: 2px;
  }

  .tab {
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--txtlo);
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid transparent;
    transition: all 0.15s;
    background: none;
    font-family: var(--sans);
  }

  .tab:hover { color: var(--txt); background: var(--raised); }

  .tab.active {
    color: var(--txth);
    background: var(--raised);
    border-color: var(--border);
  }

  .search-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-wrap input {
    background: var(--raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--txt);
    font-family: var(--sans);
    font-size: 13px;
    padding: 5px 10px;
    width: 200px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-wrap input:focus { border-color: var(--borderhi); }

  .hint {
    font-size: 12px;
    color: var(--txtlo);
  }

  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  #cy {
    flex: 1;
    background: var(--bg);
  }

  /* ── Detail panel ── */
  .detail {
    width: 380px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    z-index: 10;
  }

  .detail.open { transform: translateX(0); }

  .detail-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .detail-badge {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .detail-title {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--txth);
    line-height: 1.3;
  }

  .detail-subtitle {
    font-size: 12px;
    color: var(--txtlo);
    margin-top: 2px;
  }

  .detail-close {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--txtlo);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    flex-shrink: 0;
  }

  .detail-close:hover { color: var(--txt); }

  .detail-body {
    padding: 14px 18px;
    overflow-y: auto;
    flex: 1;
  }

  .detail-section {
    margin-bottom: 18px;
  }

  .detail-section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--txtlo);
    margin-bottom: 8px;
  }

  .detail-code {
    background: var(--raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--txt);
    white-space: pre;
    overflow-x: auto;
    tab-size: 4;
  }

  .detail-edge-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .detail-edge-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    padding: 4px 8px;
    background: var(--raised);
    border-radius: 4px;
  }

  .detail-edge-arrow {
    font-size: 10px;
    color: var(--txtlo);
  }

  .detail-edge-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--txtlo);
    background: var(--panel);
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* ── Legend ── */
  .legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    z-index: 5;
  }

  .legend-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--txtlo);
    margin-bottom: 2px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--txtlo);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Controls ── */
  .controls {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 5;
  }

  .ctrl-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--txtlo);
    font-size: 16px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .ctrl-btn:hover { color: var(--txt); border-color: var(--borderhi); }

  /* ── Token syntax highlight in code blocks ── */
  .kw { color: #ff7b72; }
  .ty { color: #79c0ff; }
  .fn { color: #d2a8ff; }
  .st { color: #a5d6ff; }
  .cm { color: #8b949e; font-style: italic; }
  .nb { color: #79c0ff; }
  .mc { color: #ffa657; }
  .op { color: #ff7b72; }
</style>
</head>
<body>

<header>
  <div class="logo">Canon <span>/ code map</span></div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('pipeline')">Pipeline</button>
    <button class="tab" onclick="switchTab('fleet')">Fleet Service</button>
    <button class="tab" onclick="switchTab('crates')">Crate DAG</button>
    <button class="tab" onclick="switchTab('types')">Type System</button>
    <button class="tab" onclick="switchTab('services')">Services</button>
  </div>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Search nodes…" oninput="doSearch(this.value)">
    <span class="hint">click node for details</span>
  </div>
</header>

<div class="main">
  <div id="cy"></div>

  <div class="detail" id="detail">
    <div class="detail-header">
      <div>
        <div class="detail-badge" id="det-badge"></div>
      </div>
      <div>
        <div class="detail-title" id="det-title"></div>
        <div class="detail-subtitle" id="det-sub"></div>
      </div>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body" id="det-body"></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="controls">
    <button class="ctrl-btn" title="Fit graph" onclick="cy.fit(undefined, 40)">⊡</button>
    <button class="ctrl-btn" title="Zoom in" onclick="cy.zoom(cy.zoom()*1.2)">+</button>
    <button class="ctrl-btn" title="Zoom out" onclick="cy.zoom(cy.zoom()*0.8)">−</button>
    <button class="ctrl-btn" title="Reset layout" onclick="relayout()">↺</button>
  </div>
</div>

<script>
cytoscape.use(cytoscapeDagre);

const TYPE_BG = {

  aggregate:    '#0a2215',
  trait:        '#0a2230',
  infra:        '#200a0a',

  projection:   '#2d1500',
  'evt-handler':'#0a2010',

// ─────────────────────────────────────────────────────────────────────────────
// Data — PIPELINE TAB
// ─────────────────────────────────────────────────────────────────────────────
const PIPELINE_DATA = {
  nodes: [
    { id:'ext',        label:'External World',         type:'external',  sub:'HTTP / gRPC / Events',       code:'' },
    { id:'adaptor',    label:'canon-adaptor-kafka',    type:'kafka',     sub:'Translates external → IncomingMessage', code:`// canon-adaptor-kafka
// Subscribes to external Kafka topics.
// Wraps each record as ExternalEvent(EventEnvelope)
// and forwards to the service inbound topic.

pub trait Adaptor: Send + Sync {
    async fn start(&self) -> Result<(), AdaptorError>;
}` },
    { id:'inbox',      label:'canon-inbox-yugabyte',   type:'db',        sub:'Dedup + window + oversight', code:`// YugabyteDB inbox tables (per-service schema)
//
// inbox_messages (handler_id, message_id)  ← dedup key
// inbox_windows  (handler_id, correlation_key)
// processed_windows (window_id)            ← batch idempotency
//
// Window key = (handler_id, correlation_key)
// Oversight: Ready | NotReady | Discard

pub trait Inbox: Send + Sync {
    async fn submit(
        &self,
        handler_id: &str,
        message_id: Uuid,
        message: IncomingMessage,
    ) -> Result<(), InboxError>;

    async fn poll_ready_windows(
        &self,
        handler_id: &str,
    ) -> Result<Vec<Window>, InboxError>;
}` },
    { id:'inqueue',    label:'canon-inbound-queue-kafka', type:'kafka',  sub:'Ordered delivery to dispatcher', code:`// rskafka consumer, partition 0
// topic: canon.{service}.inbound
// Offset tracked in-memory (starts 0 on restart)
// No consumer groups — each service has one consumer

pub trait InboundQueue: Send + Sync {
    async fn receive(&self) -> Result<Vec<IncomingMessage>, QueueError>;
}` },
    { id:'dispatcher', label:'Dispatcher',              type:'infra',    sub:'Routes commands + events', code:`// Two paths:
//
// Command path:
//   poll inbox → hydrate aggregate state
//   → call #[command_handler]
//   → YugabyteDB ACID txn:
//       INSERT INTO commands (...)
//       INSERT INTO outbox   (...) × N
//
// Event handler path:
//   poll inbox for ready windows
//   → call EventHandler::handle(events)
//   → if Some(cmd) → InboxPort::submit(cmd)` },
    { id:'cmdhandler', label:'#[command_handler]',      type:'handler',  sub:'Validates + produces one event', code:`#[command_handler(Ship, version = 1)]
impl DepartForStationHandler {
    type Error = FleetError;

    fn handle(
        &self,
        state: &Ship,
        cmd: DepartForStation,
    ) -> Result<ShipDeparted, FleetError> {
        if state.status != ShipStatus::Docked {
            return Err(FleetError::ShipNotDocked);
        }
        Ok(ShipDeparted {
            ship_id: cmd.ship_id,
            destination: cmd.destination,
            fuel_at_departure: state.fuel_kg,
        })
    }
}` },
    { id:'evthandler', label:'#[event_handler]',        type:'evt-handler', sub:'Windowed event → optional command', code:`#[event_handler]
impl DockingHandler {
    #[handles(InboundShipArrivedAtStation, version = 1)]
    fn handle(
        &self,
        events: Vec<InboundShipArrivedAtStation>,
    ) -> Option<CommandEnvelope> {
        let event = events.last()?;
        let command = DockShip {
            ship_id: event.ship_id,
            station_id: event.station_id,
        };
        Some(CommandEnvelope { /* ... */ })
    }
}` },
    { id:'yugabyte',   label:'YugabyteDB txn',          type:'db',        sub:'commands + outbox in one ACID txn', code:`-- Single transaction (per-service schema)
INSERT INTO canon_fleet.commands (command_id, aggregate_id, ...)
    VALUES ($1, $2, ...);

INSERT INTO canon_fleet.outbox (id, aggregate_id, event_type,
    event_version, payload, sequence_number, ...)
    VALUES ($1, $2, $3, $4, $5, nextval('outbox_seq'), ...);

-- Outbox is the commit point.
-- No direct Cassandra writes from command handler.` },
    { id:'outbox',     label:'Outbox Processor',         type:'infra',    sub:'Drains outbox → outbound queue', code:`// Background tokio task per service.
//
// SELECT id, payload FROM outbox
//   WHERE delivered_at IS NULL
//   ORDER BY sequence_number
//   FOR UPDATE SKIP LOCKED
//   LIMIT 100
//
// → publish to canon.{service}.outbound (rskafka)
// → UPDATE outbox SET delivered_at = now()
//
// Backpressure via bounded channel (cap 1024).` },
    { id:'outqueue',   label:'canon-outbound-queue-kafka', type:'kafka',  sub:'Fan-out to 4 consumers', code:`// rskafka producer + consumer
// topic: canon.{service}.outbound
// 4 independent consumer groups (no group commits):
//   1. event-store consumer → Cassandra
//   2. projection consumer  → YugabyteDB read models
//   3. publisher consumer   → canon.{service}.events
//   4. internal-event consumer → inbox (re-entry)` },
    { id:'evtstore',   label:'Event Store Consumer',     type:'infra',    sub:'Writes to Cassandra', code:`// Polls outbound queue.
// Writes EventEnvelope to Cassandra:
//
// INSERT INTO canon_fleet.events
//   (aggregate_id, version, event_type, event_version,
//    payload, correlation_id, causation_id, timestamp)
//   VALUES (...)
//
// If version % snapshot_every == 0:
//   → take snapshot → store in snapshots table
//
// Retry up to 3 on conflict → dead letter.` },
    { id:'cassandra',  label:'Cassandra Event Store',    type:'db',        sub:'Immutable event log', code:`-- Per-service keyspace
CREATE TABLE canon_fleet.events (
    aggregate_id UUID,
    version      BIGINT,
    event_type   TEXT,
    event_version INT,
    payload      BLOB,
    correlation_id UUID,
    causation_id   UUID,
    timestamp    TIMESTAMP,
    PRIMARY KEY (aggregate_id, version)
) WITH CLUSTERING ORDER BY (version ASC);` },
    { id:'projstore',  label:'Projection Consumer',      type:'infra',    sub:'Updates read models', code:`// Polls outbound queue.
// For each EventEnvelope:
//   → deserialise payload
//   → call Projection::apply(event, &store)
//   → update projection_checkpoints (last_version)
//
// Idempotent — safe to call twice.
// Rebuilds by resetting offset to 0
// while rebuilding = true.` },
    { id:'yugproj',    label:'YugabyteDB Projections',   type:'db',        sub:'Read models', code:`-- Projection checkpoint table
CREATE TABLE projection_checkpoints (
    projection_id TEXT PRIMARY KEY,
    last_version  BIGINT NOT NULL DEFAULT 0,
    rebuilding    BOOLEAN NOT NULL DEFAULT false
);

-- Projection data tables are service-defined, e.g.:
-- canon_fleet.ship_read_models
-- canon_station.station_inventory` },
    { id:'publisher',  label:'Publisher Consumer',       type:'infra',    sub:'Cross-service publish', code:`// Polls outbound queue.
// Publishes to canon.{service}.events (rskafka).
// Other services subscribe via canon-adaptor-kafka.
// Partitioned by aggregate_id.` },
    { id:'extevents',  label:'canon.{svc}.events',       type:'kafka',    sub:'Published events for other services', code:`// 5 published event topics:
//   canon.fleet.events
//   canon.cargo.events
//   canon.navigation.events
//   canon.supply.events
//   canon.station.events
//
// Consumed by other services via canon-adaptor-kafka.` },
    { id:'intevt',     label:'Internal Event Consumer',  type:'infra',    sub:'Own events → inbox (re-entry)', code:`// 4th outbound consumer.
// For each event envelope:
//   → check EventHandlerRegistration inventory
//     for matching #[handles] declarations
//   → for each match:
//       Inbox::submit(
//           handler_id,
//           event_id,
//           InternalEvent(envelope)
//       )
// Inbox handles dedup + windowing + oversight.` },
    { id:'inboxport',  label:'InboxPort (re-entry)',      type:'infra',    sub:'Event handler → command re-entry', code:`// When EventHandler::handle() returns Some(CommandEnvelope),
// the framework calls InboxPort::submit(cmd).
// The command re-enters the local inbox for dispatch.
// Cross-service communication = REST only (not InboxPort).

pub trait InboxPort: Send + Sync {
    async fn submit(&self, cmd: CommandEnvelope)
        -> Result<(), InboxPortError>;
}` },
  ],
  edges: [
    { source:'ext',       target:'adaptor',   kind:'flow',      label:'external events' },
    { source:'adaptor',   target:'inbox',     kind:'flow',      label:'ExternalEvent' },
    { source:'inbox',     target:'inqueue',   kind:'flow',      label:'ready messages' },
    { source:'inqueue',   target:'dispatcher',kind:'flow',      label:'IncomingMessage' },
    { source:'dispatcher',target:'cmdhandler',kind:'flow',      label:'Command path' },
    { source:'dispatcher',target:'evthandler',kind:'flow',      label:'Event handler path' },
    { source:'cmdhandler',target:'yugabyte',  kind:'produces',  label:'writes txn' },
    { source:'evthandler',target:'inboxport', kind:'reenter',   label:'Some(CommandEnvelope)' },
    { source:'inboxport', target:'inbox',     kind:'reenter',   label:'re-enters inbox' },
    { source:'yugabyte',  target:'outbox',    kind:'flow',      label:'outbox rows' },
    { source:'outbox',    target:'outqueue',  kind:'flow',      label:'publishes events' },
    { source:'outqueue',  target:'evtstore',  kind:'flow',      label:'consumer 1' },
    { source:'outqueue',  target:'projstore', kind:'flow',      label:'consumer 2' },
    { source:'outqueue',  target:'publisher', kind:'flow',      label:'consumer 3' },
    { source:'outqueue',  target:'intevt',    kind:'flow',      label:'consumer 4' },
    { source:'evtstore',  target:'cassandra', kind:'applies',   label:'writes events' },
    { source:'projstore', target:'yugproj',   kind:'applies',   label:'updates read models' },
    { source:'publisher', target:'extevents', kind:'publishes', label:'publishes' },
    { source:'extevents', target:'adaptor',   kind:'flow',      label:'other services subscribe' },
    { source:'intevt',    target:'inbox',     kind:'reenter',   label:'InternalEvent' },
  ],
  layout: { name:'dagre', rankDir:'TB', nodeSep:60, rankSep:80 },
  legend: [
    { type:'kafka',       label:'Kafka component' },
    { type:'db',          label:'Database / storage' },
    { type:'infra',       label:'Framework infra' },
    { type:'handler',     label:'Command handler' },
    { type:'evt-handler', label:'Event handler' },
    { type:'external',    label:'External world' },
  ],
};

const FLEET_DATA = {
  nodes: [
    // External inputs
    { id:'supply_evt',    label:'Supply:ResupplyDispatched',      type:'external',    sub:'External event (supply-service)', code:`// Inbound from canon.supply.events
// Deserialized in fleet-service/src/inbound.rs

#[derive(serde::Deserialize)]
pub struct InboundResupplyDispatched {
    pub ship_id:  Uuid,
    pub fuel_kg:  f32,
}` },
    { id:'nav_evt',       label:'Navigation:ShipArrivedAtStation', type:'external',   sub:'External event (navigation-service)', code:`// Inbound from canon.navigation.events
// Deserialized in fleet-service/src/inbound.rs

#[derive(serde::Deserialize)]
pub struct InboundShipArrivedAtStation {
    pub ship_id:    Uuid,
    pub station_id: Uuid,
}` },
    // Aggregate
    { id:'ship',          label:'Ship',                           type:'aggregate',   sub:'#[aggregate(snapshot_every = 50)]', code:`#[aggregate(snapshot_every = 50)]
pub struct Ship {
    pub name:             String,
    pub capacity_kg:      f32,
    pub status:           ShipStatus,
    pub assigned_route:   Option<Uuid>,

}

#[derive(Default)]
pub enum ShipStatus {
    #[default] Docked,
    InTransit,
    Decommissioned,
}` },
    // Commands
    { id:'cmd_register',  label:'RegisterShip',      type:'command', sub:'#[command(Ship, v=1)]', code:`#[command(Ship, version = 1, produces = [ShipRegistered])]
pub struct RegisterShip {
    pub name:         String,
    pub capacity_kg:  f32,

// Internal event — service reacts to its own RoutePlanned event
//
#[event_handler]
impl RoutePlannedHandler {
    #[handles(RoutePlanned, version = 1)]
    fn handle(&self, events: Vec<RoutePlanned>) -> Option<CommandEnvelope> {
        let event = events.last()?;
        let station_id = *event.waypoints.last()?;
        // Immediately schedule arrival at final waypoint
        let command = RecordArrival {
            route_id: event.route_id,
            station_id,
        };
        Some(CommandEnvelope { /* ... */ })
    }
}
// Flow: PlanRoute → RoutePlanned → RoutePlannedHandler
//    → RecordArrival → ShipArrivedAtStation` },
    { id:'eh_stockdrained',  label:'StockDrainedHandler',  type:'evt-handler', sub:'station internal: StockDrained → CheckStockLevel', code:`// station-service/src/event_handlers.rs
// Internal event — station reacts to its own drain events
//
#[event_handler]
impl StockDrainedHandler {
    #[handles(StockDrained, version = 1)]
    fn handle(&self, events: Vec<StockDrained>) -> Option<CommandEnvelope> {
        let event = events.last()?;
        if event.remaining_kg <= 0.0 {
            // Game over path → CheckStationOffline → StationOffline
            return Some(CommandEnvelope {
                command_type: "CheckStationOffline", /* ... */
            });
        }
        if event.remaining_kg < 1100.0 {
            // Low stock path → CheckStockLevel → StationStockLow
            return Some(CommandEnvelope {
                command_type: "CheckStockLevel", /* ... */
            });
        }
        None
    }
}` },
  ],
  edges: [
    // Services publish to topics
    { source:'svc_fleet',   target:'t_fleet',   kind:'publishes', label:'canon.fleet.events' },
    { source:'svc_nav',     target:'t_nav',     kind:'publishes', label:'canon.navigation.events' },
    { source:'svc_cargo',   target:'t_cargo',   kind:'publishes', label:'canon.cargo.events' },
    { source:'svc_station', target:'t_station', kind:'publishes', label:'canon.station.events' },
    { source:'svc_supply',  target:'t_supply',  kind:'publishes', label:'canon.supply.events' },

    // Fleet:ShipDeparted → Navigation (ShipDepartedHandler → PlanRoute)
    { source:'t_fleet',     target:'eh_shipdepart',   kind:'flow',    label:'ShipDeparted' },
    { source:'eh_shipdepart', target:'svc_nav',        kind:'triggers',label:'→ PlanRoute' },

    // Navigation:ShipArrivedAtStation → Fleet (DockingHandler → DockShip)
    { source:'t_nav',       target:'eh_navdock',       kind:'flow',    label:'ShipArrivedAtStation' },
    { source:'eh_navdock',  target:'svc_fleet',         kind:'triggers',label:'→ DockShip' },

    // Navigation:ShipArrivedAtStation → Cargo (ArrivalHandler → CreateManifest)
    { source:'t_nav',       target:'eh_arrival_cargo', kind:'flow',    label:'ShipArrivedAtStation' },
    { source:'eh_arrival_cargo', target:'svc_cargo',   kind:'triggers',label:'→ CreateManifest' },

    // Navigation:ShipArrivedAtStation → Cargo (UnloadingHandler — oversight gate)
    { source:'t_nav',       target:'eh_unloading',     kind:'flow',    label:'ShipArrivedAtStation (external)' },
    { source:'eh_unloading', target:'svc_cargo',        kind:'triggers',label:'→ BeginUnloading (when ready)' },

    // Navigation:ShipArrivedAtStation → Station (DockingHandler → RecordDocking)
    { source:'t_nav',       target:'eh_station_dock',  kind:'flow',    label:'ShipArrivedAtStation' },
    { source:'eh_station_dock', target:'svc_station',  kind:'triggers',label:'→ RecordDocking' },

    // Station:StationStockLow → Supply (StockLowHandler → RequestResupply)
    { source:'t_station',   target:'eh_stocklow',      kind:'flow',    label:'StationStockLow' },
    { source:'eh_stocklow', target:'svc_supply',        kind:'triggers',label:'→ RequestResupply' },

    // Supply:ResupplyDispatched → Fleet (ResupplyHandler → ScheduleResupply)
    { source:'t_supply',    target:'eh_resupply',       kind:'flow',    label:'ResupplyDispatched' },
    { source:'eh_resupply', target:'svc_fleet',          kind:'triggers',label:'→ ScheduleResupply' },

    // Navigation internal: RoutePlanned → RecordArrival → ShipArrivedAtStation
    { source:'svc_nav',     target:'eh_routeplanned',  kind:'reenter', label:'RoutePlanned (internal)' },
    { source:'eh_routeplanned', target:'svc_nav',      kind:'reenter', label:'→ RecordArrival' },

    // Station internal: StockDrained → CheckStockLevel → StationStockLow
    { source:'svc_station', target:'eh_stockdrained',  kind:'reenter', label:'StockDrained (internal)' },
    { source:'eh_stockdrained', target:'svc_station',  kind:'reenter', label:'→ CheckStockLevel / CheckStationOffline' },

    // Cargo internal: ManifestCreated feeds back into UnloadingHandler
    { source:'svc_cargo',   target:'eh_unloading',     kind:'reenter', label:'ManifestCreated (internal)' },

    // Gateway reads projections from all services
    { source:'svc_fleet',   target:'svc_gateway',      kind:'reads',   label:'ship projections' },
    { source:'svc_nav',     target:'svc_gateway',      kind:'reads',   label:'route projections' },
    { source:'svc_station', target:'svc_gateway',      kind:'reads',   label:'station projections' },
    { source:'svc_supply',  target:'svc_gateway',      kind:'reads',   label:'supply projections' },
    { source:'svc_cargo',   target:'svc_gateway',      kind:'reads',   label:'manifest projections' },
  ],
  layout: { name:'dagre', rankDir:'TB', nodeSep:50, rankSep:90 },
  legend: [
    { type:'aggregate',   label:'Service (fleet, nav)' },
    { type:'handler',     label:'Service (navigation)' },
    { type:'evt-handler', label:'Service (cargo) + event handlers' },
    { type:'projection',  label:'Service (station)' },
    { type:'command',     label:'Service (supply)' },
    { type:'kafka',       label:'Kafka published topic' },
    { type:'infra',       label:'Gateway' },
  ],
};

// ─────────────────────────────────────────────────────────────────────────────
// Tab registry
// ─────────────────────────────────────────────────────────────────────────────
const TABS = {
  pipeline: PIPELINE_DATA,
  fleet:    FLEET_DATA,
  crates:   CRATE_DATA,
  types:    TYPES_DATA,
  services: SERVICES_DATA,
};

let currentTab = 'pipeline';
let cy;

// ─────────────────────────────────────────────────────────────────────────────
// Cytoscape style factory
// ─────────────────────────────────────────────────────────────────────────────
function makeStyle() {
  const nodeTypes = Object.keys(TYPE_COLOR);
  const nodeStyles = nodeTypes.map(t => ({
    selector: `node[type="${t}"]`,
    style: {
      'background-color': TYPE_BG[t],
      'border-color': TYPE_COLOR[t],
    }
  }));

  const edgeKinds = Object.keys(EDGE_COLOR);
  const edgeStyles = edgeKinds.map(k => ({
    selector: `edge[kind="${k}"]`,
    style: { 'line-color': EDGE_COLOR[k], 'target-arrow-color': EDGE_COLOR[k] }
  }));

  return [
    {
      selector: 'node',
      style: {
        'label': 'data(label)',
        'shape': 'round-rectangle',
        'width': 'label',
        'height': 28,
        'padding': '8px',
        'font-family': '"JetBrains Mono", "Fira Code", monospace',
        'font-size': 11,
        'font-weight': 500,
        'text-valign': 'center',
        'text-halign': 'center',
        'color': '#e6edf3',
        'border-width': 1.5,
        'background-color': '#161b22',
        'border-color': '#30363d',
        'min-width': 120,
        'text-overflow-wrap': 'none',
        'white-space': 'nowrap',
        'transition-property': 'border-color, border-width, background-color',
        'transition-duration': '0.1s',
      }
    },
    ...nodeStyles,
    {
      selector: 'node:selected',
      style: {
        'border-width': 2.5,
        'border-color': '#58a6ff',
      }
    },
    {
      selector: 'node.highlighted',
      style: { 'border-width': 2, 'opacity': 1 }
    },
    {
      selector: 'node.dimmed',
      style: { 'opacity': 0.25 }
    },
    {
      selector: 'edge',
      style: {
        'width': 1.5,
        'line-color': '#4b5563',
        'target-arrow-color': '#4b5563',
        'target-arrow-shape': 'triangle',
        'curve-style': 'bezier',
        'arrow-scale': 0.8,
        'font-family': '"Inter", system-ui, sans-serif',
        'font-size': 9,
        'color': '#8b949e',
        'text-background-color': '#0d1117',
        'text-background-opacity': 0.9,
        'text-background-padding': '2px',
        'label': 'data(label)',
        'opacity': 0.85,
        'transition-property': 'opacity, line-color',
        'transition-duration': '0.1s',
      }
    },
    ...edgeStyles,
    {
      selector: 'edge.dimmed',
      style: { 'opacity': 0.08 }
    },
    {
      selector: 'edge.highlighted',
      style: { 'opacity': 1, 'width': 2 }
    },
  ];
}

// ─────────────────────────────────────────────────────────────────────────────
// Build Cytoscape elements from tab data
// ─────────────────────────────────────────────────────────────────────────────
function buildElements(data) {
  const nodes = data.nodes.map(n => ({
    group: 'nodes',
    data: { id: n.id, label: n.label, type: n.type, sub: n.sub, code: n.code }
  }));
  const edges = data.edges.map((e, i) => ({
    group: 'edges',
    data: { id: `e${i}`, source: e.source, target: e.target, kind: e.kind, label: e.label }
  }));
  return [...nodes, ...edges];
}

// ─────────────────────────────────────────────────────────────────────────────
// Render legend
// ─────────────────────────────────────────────────────────────────────────────
function renderLegend(items) {
  const el = document.getElementById('legend');
  el.innerHTML = '<div class="legend-title">Node types</div>' +
    items.map(item => `
      <div class="legend-item">
        <div class="legend-dot" style="background:${TYPE_COLOR[item.type]};border:1px solid ${TYPE_COLOR[item.type]}"></div>
        <span>${item.label}</span>
      </div>
    `).join('');
}

// ─────────────────────────────────────────────────────────────────────────────
// Init / switch tab
// ─────────────────────────────────────────────────────────────────────────────
function initCy(tabId) {
  const data = TABS[tabId];
  if (!data) return;

  if (cy) cy.destroy();

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: buildElements(data),
    style: makeStyle(),
    layout: { ...data.layout, animate: true, animationDuration: 300, fit: true, padding: 40 },
    wheelSensitivity: 0.3,
    minZoom: 0.2,
    maxZoom: 4,
  });

  // Click node → detail panel
  cy.on('tap', 'node', function(e) {
    showDetail(e.target);
    highlightNeighbourhood(e.target);
  });

  // Click background → clear
  cy.on('tap', function(e) {
    if (e.target === cy) {
      clearHighlight();
      closeDetail();
    }
  });

  renderLegend(data.legend);
}

function switchTab(tabId) {
  currentTab = tabId;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  closeDetail();
  document.getElementById('search').value = '';
  initCy(tabId);
}

function relayout() {
  if (!cy) return;
  const data = TABS[currentTab];
  cy.layout({ ...data.layout, animate: true, animationDuration: 400, fit: true, padding: 40 }).run();
}

// ─────────────────────────────────────────────────────────────────────────────
// Highlight neighbourhood
// ─────────────────────────────────────────────────────────────────────────────
function highlightNeighbourhood(node) {
  cy.elements().addClass('dimmed').removeClass('highlighted');
  const neighbourhood = node.closedNeighborhood();
  neighbourhood.addClass('highlighted').removeClass('dimmed');
}

function clearHighlight() {
  cy.elements().removeClass('dimmed').removeClass('highlighted');
}

// ─────────────────────────────────────────────────────────────────────────────
// Search
// ─────────────────────────────────────────────────────────────────────────────
function doSearch(query) {
  if (!cy) return;
  if (!query.trim()) { clearHighlight(); return; }
  const q = query.toLowerCase();
  cy.elements().addClass('dimmed').removeClass('highlighted');
  cy.nodes().forEach(n => {
    if (n.data('label').toLowerCase().includes(q) || (n.data('sub') || '').toLowerCase().includes(q)) {
      n.closedNeighborhood().addClass('highlighted').removeClass('dimmed');
    }
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Detail panel
// ─────────────────────────────────────────────────────────────────────────────
function showDetail(node) {
  const d = node.data();
  const color = TYPE_COLOR[d.type] || '#8b949e';
  const bg = TYPE_BG[d.type] || '#161b22';

  const badge = document.getElementById('det-badge');
  badge.textContent = d.type;
  badge.style.color = color;
  badge.style.background = bg;
  badge.style.border = `1px solid ${color}`;

  document.getElementById('det-title').textContent = d.label;
  document.getElementById('det-sub').textContent = d.sub || '';

  // Build body
  let html = '';

  if (d.code) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Source</div>
      <div class="detail-code">${escHtml(d.code)}</div>
    </div>`;
  }

  // Connected edges
  const inEdges  = node.incomers('edge');
  const outEdges = node.outgoers('edge');

  if (inEdges.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Incoming (${inEdges.length})</div>
      <div class="detail-edge-list">` +
      inEdges.map(e => {
        const src = e.source().data('label');
        const col = EDGE_COLOR[e.data('kind')] || '#8b949e';
        return `<div class="detail-edge-item">
          <span style="color:${col};font-size:14px">●</span>
          <span style="color:#e6edf3">${src}</span>
          <span class="detail-edge-arrow">→</span>
          <span class="detail-edge-label" style="color:${col}">${e.data('kind')}</span>
        </div>`;
      }).join('') + `</div></div>`;
  }

  if (outEdges.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Outgoing (${outEdges.length})</div>
      <div class="detail-edge-list">` +
      outEdges.map(e => {
        const tgt = e.target().data('label');
        const col = EDGE_COLOR[e.data('kind')] || '#8b949e';
        return `<div class="detail-edge-item">
          <span class="detail-edge-label" style="color:${col}">${e.data('kind')}</span>
          <span class="detail-edge-arrow">→</span>
          <span style="color:#e6edf3">${tgt}</span>
        </div>`;
      }).join('') + `</div></div>`;
  }

  document.getElementById('det-body').innerHTML = html;
  document.getElementById('detail').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
initCy('pipeline');
</script>
</body>
</html>
